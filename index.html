<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#a8d9f4">
  <title>Welcome to Learning Life</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="screen" aria-label="Learning Life welcome screen">
    <img class="artwork" src="assets/welcome-screen.jpg" alt="Bubu and Dudu on a beach, welcoming you to Learning Life">
    <form class="welcome-form" id="welcomeForm" autocomplete="on">
      <label class="visually-hidden" for="userName">Your name</label>
      <input id="userName" name="name" type="text" maxlength="32" placeholder="Enter your name" autocomplete="given-name" required>
      <button id="continueButton" type="submit" aria-label="Continue to Learning Life"></button>
      <p class="error" id="errorMessage" role="alert" aria-live="polite"></p>
    </form>
    <section class="confirmation" id="confirmation" hidden aria-live="polite">
      <div class="confirmation-card">
        <p class="hello">Nice to meet you! ♡</p>
        <h1 id="personalGreeting"></h1>
        <p>Your Learning Life is ready to begin.</p>
        <button type="button" id="editName">Change name</button>
      </div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
