<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#a9d9f4">
<title>Welcome to Learning Life</title>
<style>
:root{--brown:#56372d;--pink:#d97873;--cream:#fff9ef;--line:#dfc7b4}
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;}
body{min-height:100svh;overflow:hidden;background:#f6dfc8;font-family:ui-rounded,"Trebuchet MS",system-ui,sans-serif;color:var(--brown)}
.stage{position:fixed;inset:0;display:grid;place-items:center;isolation:isolate;overflow:hidden;background:#a9d9f4}
.stage::before{content:"";position:absolute;inset:-35px;background:url("assets/welcome-art.jpg") center 48%/cover no-repeat;filter:blur(22px) brightness(.9);transform:scale(1.08);z-index:-2}
.stage::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,244,228,.22),rgba(255,244,228,.04),rgba(255,244,228,.22));z-index:-1}
.screen{position:relative;width:min(100vw,calc(100svh * .558));height:min(100svh,calc(100vw * 1.792));aspect-ratio:857/1536;overflow:hidden;background:#fbe6d1;flex:none;box-shadow:0 12px 45px rgba(70,49,39,.17)}
.artwork{display:block;width:100%;height:100%;object-fit:fill;user-select:none;-webkit-user-drag:none;pointer-events:none}
/* Replace the text baked into the reference artwork with one real, accessible input. */
.name-field{position:absolute;left:16.1%;top:54.9%;width:67.8%;height:7.65%;display:flex;align-items:center;gap:3%;padding:0 4.8%;border:2px solid var(--line);border-radius:clamp(15px,3vw,28px);background:var(--cream);box-shadow:0 2px 0 rgba(112,77,58,.08)}
.person-icon{width:8%;height:54%;flex:none;color:#b39b89}
#userName{width:100%;min-width:0;height:100%;border:0;outline:0;background:transparent;color:var(--brown);font:600 clamp(13px,2.5vw,22px)/1.2 ui-rounded,"Trebuchet MS",system-ui,sans-serif;padding:0}
#userName::placeholder{color:#a99b8e;opacity:1;font-weight:500}
.name-field:focus-within{border-color:var(--pink);box-shadow:0 0 0 3px rgba(217,120,115,.18)}
#continueButton{position:absolute;left:25.3%;top:66.1%;width:49.5%;height:7.5%;border:0;border-radius:999px;background:transparent;cursor:pointer;-webkit-tap-highlight-color:transparent}
#continueButton:focus-visible{outline:4px solid #8b5141;outline-offset:4px}
.error{position:absolute;top:73.8%;left:12%;width:76%;margin:0;text-align:center;color:#8b3f3a;font-size:clamp(11px,1.8vw,15px);font-weight:700;text-shadow:0 1px 2px #fff}
.confirmation{position:absolute;inset:0;display:grid;place-items:center;padding:8%;background:rgba(255,239,222,.97)}
.confirmation[hidden]{display:none}
.confirmation-card{width:100%;padding:28px 22px;border:2px solid #d9bda7;border-radius:28px;background:#fff8e9;color:var(--brown);text-align:center;box-shadow:0 8px 24px rgba(91,57,43,.12)}
.hello{margin:0 0 10px;font-size:clamp(22px,5vw,34px);font-weight:800}
.confirmation-card h1{margin:0 0 12px;font-size:clamp(28px,7vw,46px);overflow-wrap:anywhere}
.confirmation-card p:not(.hello){font-size:clamp(15px,3.5vw,20px)}
#editName{margin-top:12px;padding:12px 22px;border:0;border-radius:999px;background:var(--pink);color:white;font-size:16px;font-weight:700}
.visually-hidden{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media (orientation:landscape) and (min-width:700px){.screen{height:100svh;width:auto;max-width:100vw}.stage::before{background-position:center 54%;filter:blur(26px) brightness(.82)}}
@media (max-height:500px) and (orientation:landscape){.screen{height:100svh;width:auto}}
@media (prefers-reduced-motion:no-preference){.screen{animation:arrive .45s ease-out both}@keyframes arrive{from{opacity:.7;transform:scale(.985)}to{opacity:1;transform:scale(1)}}}
</style>
</head>

<form id="welcomeForm" autocomplete="on">
<label class="visually-hidden" for="userName">Your name</label>
<div class="name-field">
<svg class="person-icon" viewBox="0 0 32 40" fill="none" aria-hidden="true"><circle cx="16" cy="10" r="7" stroke="currentColor" stroke-width="3.2"/><path d="M3.5 37v-5.5C3.5 23.8 9.1 19 16 19s12.5 4.8 12.5 12.5V37" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/></svg>

</main>
</div>
<script>
(()=>{
const form=document.getElementById('welcomeForm');
const input=document.getElementById('userName');
const error=document.getElementById('errorMessage');
const confirmation=document.getElementById('confirmation');
const greeting=document.getElementById('personalGreeting');
const edit=document.getElementById('editName');
try{const saved=localStorage.getItem('learningLifeUserName');if(saved)input.value=saved;}catch(_){/* Storage may be unavailable in private browsing. */}
form.addEventListener('submit',e=>{e.preventDefault();const name=input.value.trim();if(!name){error.textContent='Please enter your name first.';input.focus();return;}error.textContent='';try{localStorage.setItem('learningLifeUserName',name);}catch(_){}greeting.textContent='Hello, '+name+'! ♡';confirmation.hidden=false;});
edit.addEventListener('click',()=>{confirmation.hidden=true;input.focus();});
input.addEventListener('input',()=>{error.textContent='';});
})();
</script>
