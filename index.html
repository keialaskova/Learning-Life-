<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#a9d9f4">
<title>Welcome to Learning Life</title>
<style>
:root{--brown:#56372d;--pink:#d97873;--cream:#fff9ef;--line:#dfc7b4}
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;}
body{min-height:100svh;overflow:hidden;background:#f6dfc8;font-family:ui-rounded,"Trebuchet MS",system-ui,sans-serif;color:var(--brown)}
.stage{position:fixed;inset:0;display:grid;place-items:center;isolation:isolate;overflow:hidden;background:#a9d9f4}
.stage::before{content:"";position:absolute;inset:-35px;background:url("assets/welcome-art.jpg") center 48%/cover no-repeat;filter:blur(22px) brightness(.9);transform:scale(1.08);z-index:-2}
.stage::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,244,228,.22),rgba(255,244,228,.04),rgba(255,244,228,.22));z-index:-1}
.screen{position:relative;width:min(100vw,calc(100svh * .558));height:min(100svh,calc(100vw * 1.792));aspect-ratio:857/1536;overflow:hidden;background:#fbe6d1;flex:none;box-shadow:0 12px 45px rgba(70,49,39,.17)}
.artwork{display:block;width:100%;height:100%;object-fit:fill;user-select:none;-webkit-user-drag:none;pointer-events:none}
/* Replace the text baked into the reference artwork with one real, accessible input. */
.name-field{position:absolute;left:16.1%;top:54.9%;width:67.8%;height:7.65%;display:flex;align-items:center;gap:3%;padding:0 4.8%;border:2px solid var(--line);border-radius:clamp(15px,3vw,28px);background:var(--cream);box-shadow:0 2px 0 rgba(112,77,58,.08)}
.person-icon{width:8%;height:54%;flex:none;color:#b39b89}
#userName{width:100%;min-width:0;height:100%;border:0;outline:0;background:transparent;color:var(--brown);font:600 clamp(13px,2.5vw,22px)/1.2 ui-rounded,"Trebuchet MS",system-ui,sans-serif;padding:0}
#userName::placeholder{color:#a99b8e;opacity:1;font-weight:500}
.name-field:focus-within{border-color:var(--pink);box-shadow:0 0 0 3px rgba(217,120,115,.18)}
#continueButton{position:absolute;left:25.3%;top:66.1%;width:49.5%;height:7.5%;border:0;border-radius:999px;background:transparent;cursor:pointer;-webkit-tap-highlight-color:transparent}
#continueButton:focus-visible{outline:4px solid #8b5141;outline-offset:4px}
.error{position:absolute;top:73.8%;left:12%;width:76%;margin:0;text-align:center;color:#8b3f3a;font-size:clamp(11px,1.8vw,15px);font-weight:700;text-shadow:0 1px 2px #fff}
.confirmation{position:absolute;inset:0;display:grid;place-items:center;padding:8%;background:rgba(255,239,222,.97)}
.confirmation[hidden]{display:none}
.confirmation-card{width:100%;padding:28px 22px;border:2px solid #d9bda7;border-radius:28px;background:#fff8e9;color:var(--brown);text-align:center;box-shadow:0 8px 24px rgba(91,57,43,.12)}
.hello{margin:0 0 10px;font-size:clamp(22px,5vw,34px);font-weight:800}
.confirmation-card h1{margin:0 0 12px;font-size:clamp(28px,7vw,46px);overflow-wrap:anywhere}
.confirmation-card p:not(.hello){font-size:clamp(15px,3.5vw,20px)}
#editName{margin-top:12px;padding:12px 22px;border:0;border-radius:999px;background:var(--pink);color:white;font-size:16px;font-weight:700}
.visually-hidden{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media (orientation:landscape) and (min-width:700px){.screen{height:100svh;width:auto;max-width:100vw}.stage::before{background-position:center 54%;filter:blur(26px) brightness(.82)}}
@media (max-height:500px) and (orientation:landscape){.screen{height:100svh;width:auto}}
@media (prefers-reduced-motion:no-preference){.screen{animation:arrive .45s ease-out both}@keyframes arrive{from{opacity:.7;transform:scale(.985)}to{opacity:1;transform:scale(1)}}}

/* HOME DASHBOARD — first screen build; video intentionally not added yet */
.home-dashboard[hidden]{display:none}
.home-dashboard{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;background:linear-gradient(180deg,#a9d9f4 0 18%,#ffe4c8 18% 100%);color:#57392e;scrollbar-width:none;padding-bottom:88px}
.home-dashboard::-webkit-scrollbar{display:none}
.home-top{position:relative;min-height:168px;padding:24px 22px 20px;background:linear-gradient(180deg,#a7d8f4 0%,#c9eafa 62%,#f8d9b8 63%,#ffe8cf 100%);border-bottom:5px solid #f3d4ae;overflow:hidden}
.home-top:before,.home-top:after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.72);filter:blur(1px)}
.home-top:before{width:92px;height:32px;right:28%;top:30px;box-shadow:18px -9px 0 -5px rgba(255,255,255,.8)}
.home-top:after{width:68px;height:25px;left:9%;top:63px}
.home-brand{position:relative;z-index:1;font-size:clamp(23px,5vw,30px);font-weight:900;letter-spacing:-.7px;text-shadow:0 2px #fff}
.home-brand span{color:#df817e}
.home-date{position:relative;z-index:1;display:inline-flex;align-items:center;gap:8px;margin-top:25px;padding:9px 14px;border-radius:999px;background:rgba(255,250,241,.88);font-size:14px;font-weight:700}
.home-mascots{position:absolute;right:15px;bottom:4px;font-size:42px;filter:drop-shadow(0 2px 0 #fff)}
.home-content{padding:20px 18px 22px;background:linear-gradient(180deg,#ffe9d7,#fff0e9 65%,#ffe6cc)}
.home-greeting{margin:0 0 5px;font-size:clamp(23px,5.5vw,30px);font-weight:900;line-height:1.2}
.home-subtitle{margin:0 0 18px;font-size:15px;line-height:1.45;color:#76574a}
.home-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin:16px 0}
.home-stat{min-height:104px;border:1.5px solid #e9c9c4;border-radius:22px;padding:12px 7px;text-align:center;box-shadow:0 3px 0 rgba(116,75,55,.06)}
.home-stat:nth-child(1){background:#ffe0e5}.home-stat:nth-child(2){background:#f5e5f0}.home-stat:nth-child(3){background:#fff0cf}
.home-stat .emoji{display:block;font-size:25px;margin-bottom:4px}
.home-stat strong{display:block;font-size:25px;line-height:1.1}
.home-stat span:last-child{font-size:13px;font-weight:700}
.home-panel{background:rgba(255,252,246,.94);border:1.5px solid #e7cfc1;border-radius:25px;padding:15px 15px 13px;margin-top:14px;box-shadow:0 4px 12px rgba(106,72,54,.06)}
.home-panel-heading{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.home-panel-heading h2{font-size:19px;margin:0;font-weight:900}
.home-add{width:34px;height:34px;border:0;border-radius:50%;background:#f5dce0;color:#8b4f47;font-size:23px;line-height:1;cursor:pointer}
.home-task{display:flex;align-items:center;gap:11px;padding:11px 2px;border-top:1px solid #f0e1d8;font-size:15px;font-weight:700}
.home-task input{appearance:none;width:22px;height:22px;border:2px solid #a98b7a;border-radius:7px;background:#fff;flex:none}
.home-task input:checked{background:#65b982;border-color:#65b982}
.home-task input:checked:after{content:"✓";display:block;color:#fff;text-align:center;font-weight:900;line-height:18px}
.home-task.done span{text-decoration:line-through;opacity:.55}
.home-empty{padding:12px 0;color:#987f70;font-size:14px}
.home-bottom{position:sticky;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:9px 8px calc(9px + env(safe-area-inset-bottom));background:rgba(255,241,226,.97);border-top:1px solid #e6cfc0;backdrop-filter:blur(10px)}
.home-nav{border:0;background:transparent;color:#51382e;border-radius:18px;padding:7px 2px 5px;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:inherit;font-size:12px;font-weight:700;line-height:1.15;cursor:pointer}
.home-nav .nav-icon{font-size:24px;line-height:1.1}
.home-nav.active{background:#e88786;color:white}
.home-nav:focus-visible,.home-add:focus-visible{outline:3px solid #805044;outline-offset:2px}
.home-toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);padding:9px 14px;border-radius:999px;background:#654438;color:white;font-size:13px;z-index:5;white-space:nowrap}
@media(min-width:700px){.home-dashboard{width: min(100%,560px);left:50%;transform:translateX(-50%);box-shadow:0 0 35px rgba(75,60,50,.14)}}

</style>
</head>
<body>
<div class="stage">
<main class="screen" aria-label="Learning Life welcome screen">
<img class="artwork" src="assets/welcome-art.jpg" alt="Bubu and Dudu welcoming you on a beach">
<form id="welcomeForm" autocomplete="on">
<label class="visually-hidden" for="userName">Your name</label>
<div class="name-field">
<svg class="person-icon" viewBox="0 0 32 40" fill="none" aria-hidden="true"><circle cx="16" cy="10" r="7" stroke="currentColor" stroke-width="3.2"/><path d="M3.5 37v-5.5C3.5 23.8 9.1 19 16 19s12.5 4.8 12.5 12.5V37" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/></svg>
<input id="userName" name="name" type="text" maxlength="32" placeholder="Enter your name" autocomplete="given-name" required>
</div>
<button id="continueButton" type="submit" aria-label="Continue to Learning Life"></button>
<p class="error" id="errorMessage" role="alert" aria-live="polite"></p>
</form>
<section class="confirmation" id="confirmation" hidden aria-live="polite"><div class="confirmation-card"><p class="hello">Nice to meet you! ♡</p><h1 id="personalGreeting"></h1><p>Your Learning Life is ready to begin.</p><button type="button" id="editName">Change name</button></div></section>
</main>

<section class="home-dashboard" id="homeDashboard" hidden aria-label="Learning Life home dashboard">
  <header class="home-top">
    <div class="home-brand">Learning Life <span>♡</span></div>
    <div class="home-date"><span aria-hidden="true">▣</span><span id="homeDate"></span></div>
    <div class="home-mascots" aria-hidden="true">🐼 🐻</div>
  </header>
  <main class="home-content">
    <h1 class="home-greeting" id="homeGreeting">Good day! ♡</h1>
    <p class="home-subtitle">A little progress each day adds up!</p>
    <div class="home-stats" aria-label="Today's progress">
      <div class="home-stat"><span class="emoji" aria-hidden="true">☑️</span><strong id="taskProgress">0/2</strong><span>Tasks</span></div>
      <div class="home-stat"><span class="emoji" aria-hidden="true">🗓️</span><strong id="scheduleCount">0</strong><span>Schedule</span></div>
      <div class="home-stat"><span class="emoji" aria-hidden="true">🎯</span><strong id="goalCount">0</strong><span>Goals</span></div>
    </div>
    <section class="home-panel">
      <div class="home-panel-heading"><h2>♡ Today's Tasks</h2><button class="home-add" id="addHomeTask" type="button" aria-label="Add task">+</button></div>
      <div id="homeTaskList">
        <label class="home-task"><input type="checkbox"><span>Finish report</span></label>
        <label class="home-task"><input type="checkbox"><span>Buy groceries</span></label>
      </div>
    </section>
    <section class="home-panel">
      <div class="home-panel-heading"><h2>Today's reminder</h2><span aria-hidden="true">🌷</span></div>
      <p style="margin:0;color:#76574a;font-size:14px;line-height:1.5">Take things one step at a time. You are making progress.</p>
    </section>
  </main>
  <nav class="home-bottom" aria-label="Main navigation">
    <button class="home-nav active" type="button" data-home-tab="Home"><span class="nav-icon">⌂</span><span>Home</span></button>
    <button class="home-nav" type="button" data-home-tab="Calendar"><span class="nav-icon">▦</span><span>Calendar</span></button>
    <button class="home-nav" type="button" data-home-tab="Money"><span class="nav-icon">＄</span><span>Money</span></button>
    <button class="home-nav" type="button" data-home-tab="More"><span class="nav-icon">▦</span><span>More</span></button>
  </nav>
</section>

</div>
<script>
(()=>{
const form=document.getElementById('welcomeForm');
const input=document.getElementById('userName');
const error=document.getElementById('errorMessage');
const confirmation=document.getElementById('confirmation');
const greeting=document.getElementById('personalGreeting');
const edit=document.getElementById('editName');
const dashboard=document.getElementById('homeDashboard');
const artwork=document.querySelector('.artwork');
const dateNode=document.getElementById('homeDate');
const homeGreeting=document.getElementById('homeGreeting');
const taskList=document.getElementById('homeTaskList');
const progress=document.getElementById('taskProgress');

try{const saved=localStorage.getItem('learningLifeUserName');if(saved)input.value=saved;}catch(_){}

function updateProgress(){
 const boxes=[...taskList.querySelectorAll('input[type="checkbox"]')];
 const done=boxes.filter(x=>x.checked).length;
 progress.textContent=done+'/'+boxes.length;
 boxes.forEach(box=>box.closest('.home-task').classList.toggle('done',box.checked));
}
function showHome(name){
 form.hidden=true;
 artwork.hidden=true;
 confirmation.hidden=true;
 dashboard.hidden=false;
 const safeName=(name||'there').trim();
 homeGreeting.textContent='Good day, '+safeName+'! ♡';
 const now=new Date();
 dateNode.textContent=new Intl.DateTimeFormat(undefined,{weekday:'short',month:'short',day:'numeric',year:'numeric'}).format(now);
 updateProgress();
}
form.addEventListener('submit',e=>{
 e.preventDefault();
 const name=input.value.trim().replace(/\s+/g,' ');
 if(!name){error.textContent='Please enter your name first ♡';input.focus();return;}
 error.textContent='';
 try{localStorage.setItem('learningLifeUserName',name);}catch(_){}
 showHome(name);
});
edit.addEventListener('click',()=>{confirmation.hidden=true;input.focus();});
input.addEventListener('input',()=>{error.textContent='';});
taskList.addEventListener('change',updateProgress);
document.getElementById('addHomeTask').addEventListener('click',()=>{
 const task=prompt('What task would you like to add?');
 if(!task||!task.trim())return;
 const label=document.createElement('label');label.className='home-task';
 const box=document.createElement('input');box.type='checkbox';
 const span=document.createElement('span');span.textContent=task.trim();
 label.append(box,span);taskList.append(label);updateProgress();
});
document.querySelectorAll('[data-home-tab]').forEach(btn=>btn.addEventListener('click',()=>{
 document.querySelectorAll('[data-home-tab]').forEach(x=>x.classList.toggle('active',x===btn));
 const tab=btn.dataset.homeTab;
 if(tab!=='Home')alert(tab+' page will be built next.');
}));
})();
</script>
</body>
</html>
